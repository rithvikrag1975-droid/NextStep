<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NextStep</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #e8f1f2;
}


        header {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
}

        header h1 {
            margin: 0;
            font-size: clamp(42px, 6vw, 80px);
            letter-spacing: 2px;
}

        header a {
            color: #9ef0c3;
            text-decoration: none;
            margin: 0 12px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
}

        header a:hover {
            text-shadow: 0 0 8px #9ef0c3;
}

/* PAGE LAYOUT */
        .page {
            max-width: 1200px;
            margin: auto;
            padding: 60px 20px;
}




/* FOOTER */
        footer {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            font-size: 14px;
}

/* MOBILE */
        @media (max-width: 900px) {
            .section,
            .section.reverse {
            flex-direction: column;
            text-align: center;
    }

        .section img {
            width: 260px;
    }
}


  
  

  /* Search Bar */
  .search-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-bar input, .search-bar select {
    padding: 10px;
    border-radius: 5px;
    border: none;
    outline: none;
  }

  .search-bar input {
    width: 200px;
    color: black;
  }

  .search-bar select {
    background-color: rgb(7, 7, 7);
    color: #fff;
  }
 .search-bar button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #0d0e0d;
        color: #fff;
        cursor: pointer;
    }

  /* Internship Cards */
  .internship-box {
    background: linear-gradient( 120deg, #111,#222);
    border: 1px solid #111111;
    border-radius: 20px;
    margin: 15px auto;
    padding: 25px;
    max-width: 700px;
    transition: 0.3s;    
    border: 1px solid #333d38;
    box-shadow: inset 0 0 10px #0f2027, 0 10px 25px rgba(0,255,127,0.2);
  }

  

.internship_grid {
    display: grid;
    /* grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); */
    grid-template-columns: repeat(4, minmax(200px, max-content));
    grid-auto-rows: minmax(180px, auto);
    gap: 20px;
    padding: 10px;
    justify-items: stretch;
  }
  .internship-box:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 0 40px rgba(61, 250, 146, 0.5), 0 0 80px rgba(158, 240, 195, 0.2);
    transition: 0.4s ease-in-out;
  }

  .internship-box h3 {
    margin: 0;
    color: #9ef0c3;
    font-family: 'Space Grotesk', sans-serif;
  }

  .internship-box button {
    margin-top: 10px;
    padding: 8px 12px;
    background-color: #9ef0c3;
    color: #111;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
  }

  .internship-box button:hover {
    background-color: #a6ccb7;
  }

  .internship-details {
    display: none;
    margin-top: 10px;
  }

  .internship-details a {
    color: #00ff7f;
    text-decoration: none;
    font-weight: bold;
  }

  .internship-details a:hover {
    text-decoration: underline;
  }
  .glowline {
      width: 100%;
    height: 4px;
    background: linear-gradient(270deg, #9ef0c3, #00ff7f, #9ef0c3);
    background-size: 600% 100%;
    animation: move-line 3s linear infinite;
    border-radius: 5px;
    margin: 30px 0;
    box-shadow: 0 0 15px #00ff7f;
}

@keyframes move-line {
    0% { background-position: 0% 0; }
    100% { background-position: 100% 0; }
  }
.side-text {
    position: fixed;        /* stays on the side even when scrolling */
    top: 50%;               /* center vertically */
    transform: translateY(-50%);  /* exact vertical centering */
    writing-mode: vertical-rl;    /* makes text vertical */
    text-orientation: mixed;      /* letters stay upright */
    font-family: 'Orbitron', sans-serif;
    color: #00ff7f;
    font-size: 20px;
    font-weight: bold;
    opacity: 0.4;           /* makes it subtle */
    pointer-events: none;    /* allows clicks through the text */
    letter-spacing: 2px;
}

.side-text.left { left: 10px; }
.side-text.right { right: 10px; }  

.container {
  display: grid;
  /* 4 equal-width columns */
  grid-template-columns: repeat(4, minmax(200px, max-content));
  gap: 20px;
  width: 100%;
  /* padding: 10px; */
}

.container div {
 
  padding: 10px;
  text-align: center;
}
</style>
</head>
<body>

    </style>
</head>

<body>

<header>
    <h1><i>NextStep</i></h1>
    <p>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="internships.html">Internships</a>
        <a href="Certificates.html">Certificates</a>
        <a href="Volunteer.html">Volunteering</a>
        <a href="resume.html">Resume</a>
        <a href="Tips.html">Tips</a>
        <a href="Contact.html">Contact</a>
    </p>
</header>
<div class="side-text left">INTERNSHIPS →</div>
<div class="side-text right">EXPLORE MORE →</div>
<main class="page">
<div class="search-bar">
  <input type="text" id="keyword" placeholder="Keyword (e.g., Science, Media)" style="font-family: 'Space Grotesk', sans-serif; color: rgb(10, 10, 10);">
  <select id="age" style="font-family: 'Space Grotesk', sans-serif;">
    <option value="">All Ages</option>
    <option value="14">14+</option>
    <option value="15">15+</option>
    <option value="16">16+</option>
    <option value="18">18+</option>
  </select>
  <select id="major" style="font-family: 'Space Grotesk', sans-serif;">
    <option value="">All Majors</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Arts">Arts & Media</option>
    <option value="Business">Business</option>
    <option value="Health">Health & Science</option>
    <option value="Civic">Civic & Government</option>
    <option value="Education">Education</option>
    <option value="Environment">Environment</option>
  </select>
  <button onclick="filterInternships()" style="font-family: 'Space Grotesk', sans-serif; background-color: #0d0e0d;">Search</button>
</div>
<div class = "glowline"></div>
<div class = "particle"></div>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<!-- Internship Cards -->
<div id="internships-container" class="internship_grid">
    <!-- Cards will be injected by JS -->
</div>




<script>
async function loadInternships() {
  const container = document.getElementById('internships-container');
  if (!container) return;

  try {
    const response = await fetch('internships.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('Failed to load internships.json');
    const data = await response.json();

    container.innerHTML = '';
    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'internship-box';
      card.dataset.age = item.age || '';
      card.dataset.keyword = item.keyword || '';
      card.dataset.major = (item.majors && item.majors.length) ? item.majors.join('|') : '';

      const title = document.createElement('h3');
      title.textContent = item.title || '';

      const button = document.createElement('button');
      button.textContent = 'More Info';
      button.addEventListener('click', () => toggleBox(button));

      const details = document.createElement('div');
      details.className = 'internship-details';

      (item.details || []).forEach(text => {
        const p = document.createElement('p');
        p.textContent = text;
        details.appendChild(p);
      });

      if (item.link) {
        const a = document.createElement('a');
        a.href = item.link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = item.link_text || 'Apply';
        details.appendChild(a);
      }

      card.appendChild(title);
      card.appendChild(button);
      card.appendChild(details);
      container.appendChild(card);
    });
  } catch (err) {
    container.innerHTML = '<p>Could not load internships.</p>';
  }
}

function toggleBox(button) {
  const details = button.nextElementSibling;
  details.style.display = details.style.display === 'block' ? 'none' : 'block';
}

// Search/filter function
function filterInternships() {
  const keyword = document.getElementById('keyword').value.toLowerCase();
  const age = document.getElementById('age').value;
  const major = document.getElementById('major').value;

  const internships = document.querySelectorAll('.internship-box');

  internships.forEach(box => {
    const boxKeyword = box.dataset.keyword.toLowerCase();
    const boxAge = box.dataset.age;
    const boxMajor = box.dataset.major || '';
    const majors = boxMajor.split('|').filter(Boolean);

    const keywordMatch = keyword === '' || boxKeyword.includes(keyword);
    const ageMatch = age === '' || parseInt(boxAge) >= parseInt(age);
    const majorMatch = major === '' || majors.includes(major);

    if (keywordMatch && ageMatch && majorMatch) {
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  });
}

document.addEventListener('DOMContentLoaded', loadInternships);
</script>
    
    

    
</main>

<footer>
    <p>© 2026 NextStep. All rights reserved.</p>
</footer>

</body>
</html>
